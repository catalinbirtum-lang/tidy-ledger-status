<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>BUSINESS CONTROL BRAIN</title>
<style>
:root{--bg:#04060c;--bg2:#070b16;--panel:rgba(12,18,32,.86);--panel2:rgba(18,27,48,.9);--line:#1a2a46;--line2:#25406b;--tx:#dbe6fa;--mut:#8ea0c0;--cy:#3de0ff;--vi:#8b7bff;--ok:#2fe08a;--warn:#ffb52e;--bad:#ff5470;--unk:#6f7d96;--info:#5aa0ff;--r:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-wrap:anywhere;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background-image:radial-gradient(1200px 600px at 15% -10%,rgba(61,224,255,.10),transparent 60%),radial-gradient(900px 500px at 95% 5%,rgba(139,123,255,.12),transparent 60%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><g stroke='%231a2a46' stroke-width='1' fill='none' opacity='.55'><path d='M10 40 L80 90 L150 30 L210 100 M80 90 L60 180 L140 200 L210 100 M150 30 L190 10 M60 180 L10 150'/></g><g fill='%2325406b'><circle cx='10' cy='40' r='2.2'/><circle cx='80' cy='90' r='2.6'/><circle cx='150' cy='30' r='2.2'/><circle cx='210' cy='100' r='2.4'/><circle cx='60' cy='180' r='2.2'/><circle cx='140' cy='200' r='2.4'/></g></svg>");background-attachment:fixed}
a{color:var(--cy);text-decoration:none;overflow-wrap:anywhere}a:hover{text-decoration:underline}
.wrap{max-width:1360px;margin:0 auto;padding:12px 16px 40px}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:14px 4px 10px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:clamp(18px,3.2vw,28px);letter-spacing:.18em;font-weight:700;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;color:var(--mut);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);font-size:13px;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:600}
.light{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--unk);box-shadow:0 0 0 2px rgba(255,255,255,.04);flex:none}
.light.ok{background:var(--ok);box-shadow:0 0 8px rgba(47,224,138,.55)}
.light.warn,.light.attention{background:var(--warn);box-shadow:0 0 8px rgba(255,181,46,.5)}
.light.blocked,.light.stale{background:var(--bad);box-shadow:0 0 8px rgba(255,84,112,.55)}
.light.unverified,.light.info,.light.waiting{background:var(--info)}
.light.idle,.light.unknown{background:var(--unk)}
.light.in_progress{background:var(--cy);box-shadow:0 0 8px rgba(61,224,255,.6)}
.light.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,224,255,.7)}50%{box-shadow:0 0 0 7px rgba(61,224,255,0)}}
@media (prefers-reduced-motion:reduce){.light.live{animation:none}}
.banner{margin:12px 0 0;padding:12px 14px;border-radius:var(--r);border:1px solid var(--bad);background:rgba(255,84,112,.10);font-size:14px}
.banner.warn{border-color:var(--warn);background:rgba(255,181,46,.10)}
.banner.info{border-color:var(--info);background:rgba(90,160,255,.08)}
.banner strong{letter-spacing:.04em}
#hier{display:grid;grid-template-columns:1fr;gap:0;margin:16px 0 4px}
.node{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;margin-bottom:22px}
.node:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:-22px;width:2px;height:22px;background:linear-gradient(var(--line2),var(--cy))}
.node .lvl{font-size:11px;letter-spacing:.2em;color:var(--cy);font-weight:700}
.node .nm{font-weight:600;margin:2px 0}
.node .hd{display:flex;align-items:center;gap:8px;font-size:14px}
.node .dt{color:var(--mut);font-size:12.5px;margin-top:4px;overflow-wrap:anywhere}
.node .kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kvp{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--bg2)}
.kvp b{font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:10px}
.card{grid-column:span 12;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;backdrop-filter:blur(4px)}
.card>h2{margin:0 0 10px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cy);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card>h2 .no{font-family:var(--mono);color:var(--vi)}
.card>h2 .sub{margin-left:auto;font-size:11px;color:var(--mut);letter-spacing:.04em;text-transform:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.metric .t{font-size:12px;color:var(--mut)}
.metric .v{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.2;margin:2px 0;overflow-wrap:anywhere}
.metric .v.unk{color:var(--unk);font-size:20px;letter-spacing:.06em}
.metric .f{font-size:11px;color:var(--mut);margin-top:4px;overflow-wrap:anywhere}
.metric .n{font-size:11.5px;color:#a9b6cf;margin-top:3px}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.08em;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);vertical-align:middle}
.pill.FACT{color:var(--ok);border-color:rgba(47,224,138,.5)}
.pill.ESTIMATE{color:var(--warn);border-color:rgba(255,181,46,.5)}
.pill.UNKNOWN{color:var(--mut);border-color:var(--unk)}
.pill.STALE{color:#fff;background:var(--bad);border-color:var(--bad)}
.pill.sev-high,.pill.sev-critical{color:var(--bad);border-color:var(--bad)}
.pill.sev-medium{color:var(--warn);border-color:var(--warn)}
.pill.sev-low,.pill.sev-info{color:var(--info);border-color:var(--info)}
.pill.TARGET{color:var(--vi);border-color:var(--vi)}
.chan{margin-top:12px}
.chan h3{margin:0 0 6px;font-size:13px;color:var(--tx);display:flex;gap:8px;align-items:center}
.bar{height:8px;background:#0c1426;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi))}
.big{font-family:var(--mono);font-size:clamp(34px,7vw,56px);font-weight:800;line-height:1;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--mut)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.step{font-size:11px;letter-spacing:.06em;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--mut)}
.step.on{color:#04121a;background:var(--cy);border-color:var(--cy);font-weight:700}
.step.done{color:var(--ok);border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
table{table-layout:auto;max-width:100%}
.scroll{overflow-x:auto;max-width:100%}
th{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line2)}
.tl li{position:relative;padding:0 0 12px 14px}
.tl li::before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--cy)}
.tl .ts{font-family:var(--mono);font-size:12px;color:var(--vi)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--cy);font-size:13px;padding:6px 0}
.lk{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:3px 0;font-size:13px}
.lk .st{font-size:11px;color:var(--mut)}
.lk .st.ok{color:var(--ok)}.lk .st.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.radar svg{width:100%;height:auto;background:rgba(5,9,18,.6);border:1px solid var(--line);border-radius:12px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--panel2)}
.rcard .rt{font-weight:600}
.rcard dl{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin:6px 0 0;font-size:13px}
.rcard dt{color:var(--mut)}.rcard dd{margin:0;overflow-wrap:anywhere}
footer{margin-top:24px;color:var(--mut);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
#err{display:none}
.center{text-align:center}
@media (min-width:900px){
 #hier{grid-template-columns:repeat(5,1fr);gap:26px}
 .node{margin-bottom:0}
 .node:not(:last-child)::after{left:auto;right:-26px;bottom:auto;top:50%;width:26px;height:2px;background:linear-gradient(90deg,var(--line2),var(--cy))}
 .s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}.s5{grid-column:span 5}.s7{grid-column:span 7}
}
@media (max-width:480px){.wrap{padding:8px 10px 32px}.chip{white-space:normal}.metric .v{font-size:22px}.rcard dl{grid-template-columns:1fr}}
.owner{margin:14px 0 6px;padding:16px;border:1px solid var(--line2);border-radius:var(--r);background:linear-gradient(180deg,rgba(18,27,48,.95),rgba(8,12,22,.92))}
.owner h2{margin:0 0 4px;font-size:clamp(18px,3vw,24px);letter-spacing:.04em}
.owner .osub{color:var(--mut);font-size:13px;margin-bottom:12px}
.owner .oupdated{font-family:var(--mono);font-size:13px;color:var(--vi);margin-bottom:14px}
.owner .osec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.owner .osec h3{margin:0 0 8px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--cy)}
.owner .olist{margin:0;padding:0;list-style:none}
.owner .olist li{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.owner .olist li:first-child{border-top:0}
.owner .otag{display:inline-block;min-width:7.5rem;color:var(--mut);font-size:12px}
.owner .oval{font-family:var(--mono);font-weight:700}
.owner a.opage{display:block;padding:4px 0;font-size:13px;overflow-wrap:anywhere}
.owner .okill{margin-top:6px;font-size:12px;color:var(--warn)}
.owner .ocols{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:800px){.owner .ocols{grid-template-columns:1fr 1fr 1fr}}
.owner .obox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.owner .obox h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--vi)}
details.advanced{margin-top:18px}
details.advanced>summary{cursor:pointer;color:var(--mut);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="brand"><h1>BUSINESS CONTROL BRAIN</h1><p id="subtitle">Cum merge afacerea · How the business is doing</p></div>
 <div class="chips" id="topchips"></div>
</header>
<div id="banners"></div>
<div id="owner"></div>
<noscript><div class="banner"><strong>JavaScript is required.</strong> This page renders everything from public_status.json.</div></noscript>
<div id="err" class="banner"></div>
<section id="hier" aria-label="Hierarchy: owner, CEO, business, distribution, results"></section>
<div class="grid" id="grid"></div>
<footer id="foot"></footer>
</div>
<script src="./config.js"></script>
<script src="./public_status.js" onerror="void 0"></script>
<script>
(function(){
"use strict";
var CFG = window.TL_CONFIG || {SNAPSHOT_URLS:["./public_status.json"],SNAPSHOT_STALE_HOURS:6,REFETCH_MINUTES:5};
var TZ = "Europe/London";
var SNAP = null, SOURCE = null, TRIED = [];

/* ---------- tiny DOM helper (textContent only: snapshot text is never parsed as HTML) ---------- */
function h(tag, props){
  var el = document.createElement(tag);
  if(props){ for(var k in props){ var v = props[k]; if(v==null||v===false) continue;
    if(k==="class") el.className = v; else if(k==="text") el.textContent = v; else el.setAttribute(k, v===true?"":v); } }
  for(var i=2;i<arguments.length;i++){ add(el, arguments[i]); }
  return el;
}
function add(el, c){ if(c==null||c===false) return; if(Array.isArray(c)){ c.forEach(function(x){add(el,x);}); }
  else el.appendChild(typeof c==="string"||typeof c==="number" ? document.createTextNode(String(c)) : c); }
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function $(s){ return document.querySelector(s); }

/* ---------- time helpers (everything shown in Europe/London) ---------- */
function ms(iso){ var t = Date.parse(iso); return isNaN(t) ? null : t; }
function fmtDT(iso){ var t = ms(iso); if(t==null) return "UNKNOWN";
  return new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(t)) + " " + tzName(t); }
function tzName(t){ var p = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,timeZoneName:"short"}).formatToParts(new Date(t)).filter(function(x){return x.type==="timeZoneName";})[0]; return p?p.value:"UK"; }
function fmtHM(t){ return new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(t)); }
function ymdLondon(t){ return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(t)); }
function dayDiff(a,b){ var A = a.split("-").map(Number), B = b.split("-").map(Number); return Math.round((Date.UTC(A[0],A[1]-1,A[2])-Date.UTC(B[0],B[1]-1,B[2]))/86400000); }
function ago(t, now){ var s = Math.floor(((now||Date.now())-t)/1000); if(s<-60) return "in the future (clock skew?)"; s=Math.max(s,0);
  var d=Math.floor(s/86400), hh=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d) return d+"d "+hh+"h ago"; if(hh) return hh+"h "+m+"m ago"; if(m) return m+"m ago"; return "just now"; }
function ageH(iso){ var t = ms(iso); return t==null ? null : (Date.now()-t)/3600000; }

/* ---------- value formatting: UNKNOWN is never shown as 0 ---------- */
function fmtVal(m){
  if(!m || m.value===null || m.value===undefined) return {t:"UNKNOWN", unk:true};
  if(m.unit==="gbp") return {t:"£"+Number(m.value).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})};
  if(typeof m.value==="number") return {t:m.value.toLocaleString("en-GB")};
  return {t:String(m.value)};
}
function pill(label){ return h("span",{class:"pill "+label,text:label}); }
function lightEl(state, live){ return h("span",{class:"light "+state+(live?" live":""),title:state}); }
function staleMetric(m){ if(!m||m.value==null||!m.as_of) return false; var a = ageH(m.as_of); var lim = m.stale_after_hours || (SNAP.freshness&&SNAP.freshness.metric_default_stale_after_hours) || 24; return a!=null && a>lim; }

function metricCard(key, opts){
  var m = SNAP.metrics[key]; if(!m) return h("div",{class:"metric"},h("div",{class:"t",text:key}),h("div",{class:"v unk",text:"UNKNOWN"}),h("div",{class:"f",text:"metric missing from snapshot"}));
  var v = fmtVal(m);
  return h("div",{class:"metric",id:"m-"+key},
    h("div",{class:"t",text:m.title}),
    h("div",{class:"v"+(v.unk?" unk":""),"data-metric":key,text:v.t}),
    h("div",null,pill(m.label)," ",staleMetric(m)?h("span",{class:"pill STALE",title:"older than "+(m.stale_after_hours||24)+" h",text:"STALE"}):null),
    m.note?h("div",{class:"n",text:m.note}):null,
    h("div",{class:"f",text:"source: "+m.source}),
    h("div",{class:"f",text:"as of "+(m.as_of?fmtDT(m.as_of)+" ("+ago(ms(m.as_of))+")":"UNKNOWN")}));
}
function chipMetric(key){ var m = SNAP.metrics[key]; var v = fmtVal(m); return h("span",{class:"kvp"}, (m?m.title:key)+": ", h("b",{text:v.t}), " ", pill(m?m.label:"UNKNOWN")); }

/* ---------- freshness ---------- */
function freshness(){
  var t = ms(SNAP.generated_at), lim = (SNAP.freshness&&SNAP.freshness.snapshot_stale_after_hours) || CFG.SNAPSHOT_STALE_HOURS || 6;
  var age = t==null ? null : (Date.now()-t)/3600000;
  return {t:t, age:age, limit:lim, stale: age==null || age>lim, skew: age!=null && age < -0.1};
}
function nextSync(){
  var sched = (SNAP.freshness&&SNAP.freshness.sync_schedule_uk)||[]; var now = Date.now(); var best=null;
  [0,1].forEach(function(d){ sched.forEach(function(hm){
    var base = ymdLondon(now + d*86400000); var p = hm.split(":");
    var guess = Date.parse(base+"T"+hm+":00Z"); /* London offset search */
    for(var off=-120; off<=60; off+=60){ var c = guess+off*60000; var s = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(c));
      if(s===hm && ymdLondon(c)===base){ if(c>now && (best==null||c<best)) best=c; } } }); });
  return best;
}
function lastExpected(){
  var sched = (SNAP.freshness&&SNAP.freshness.sync_schedule_uk)||[]; var now = Date.now(); var best=null;
  [-1,0].forEach(function(d){ sched.forEach(function(hm){
    var base = ymdLondon(now + d*86400000); var guess = Date.parse(base+"T"+hm+":00Z");
    for(var off=-120; off<=60; off+=60){ var c = guess+off*60000; var s = new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(c));
      if(s===hm && ymdLondon(c)===base && c<=now && (best==null||c>best)) best=c; } }); });
  return best;
}
function dayInfo(){
  var C = SNAP.challenge, today = ymdLondon(Date.now()), day = dayDiff(today, C.start_date)+1, tot = C.total_days;
  if(day<1) return {txt:"PRE-LAUNCH", day:day, tot:tot, pct:0, status:"pre-launch"};
  if(day>tot) return {txt:"ENDED", day:tot, tot:tot, pct:100, status:"ended"};
  return {txt:"DAY "+day+" / "+tot, day:day, tot:tot, pct:Math.round(day/tot*100), status:"running"};
}

/* ---------- owner-simple (Catalin first view) ---------- */
function fmtMoney(m){
  if(!m || m.value===null || m.value===undefined) return "UNKNOWN";
  if(m.unit==="gbp" || (typeof m.value==="number" && /gbp|£|earnings|revenue|spend|cash|capital|profit|sales/i.test(m.title||m.title_en||""))){
    return "£" + Number(m.value).toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:2});
  }
  return String(m.value);
}
function ownerMetricLine(ro, en, m){
  var lab = (m && m.label) ? m.label : "UNKNOWN";
  var val = (m && (m.value!==null && m.value!==undefined)) ? (m.unit==="gbp" || /gbp|capital|cash|spend|revenue|profit|earnings|sales/i.test(en||"") ? "£"+Number(m.value).toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:2}) : String(m.value)) : (m && m.value===0 ? "0" : "UNKNOWN");
  // value 0 is valid FACT
  if(m && m.value===0) val = (m.unit==="gbp" || /gbp|capital|cash|spend|revenue|profit|earnings|sales/i.test(en||"")) ? "£0" : "0";
  if(m && (m.value===null || m.value===undefined) && lab==="UNKNOWN") val = "UNKNOWN";
  return h("li",null,
    h("span",{class:"otag",text:ro+" ("+en+")"}),
    " ", h("span",{class:"oval",text:val}), " ", pill(lab));
}
function sOwner(){
  var O = SNAP.owner_simple; if(!O) return h("div",{id:"owner-missing",class:"banner warn"}, h("strong",{text:"Owner view missing"}), document.createTextNode(" — rebuild with brain/build_snapshot.py"));
  var S = O.sections || {};
  var root = h("section",{class:"owner","aria-label":"Owner business status"});
  root.appendChild(h("h2",{text:(O.title_ro||"Status")+" / "+(O.title_en||"Status")}));
  root.appendChild(h("div",{class:"osub",text:(O.subtitle_ro||"")+" "+(O.subtitle_en||"")}));
  root.appendChild(h("div",{class:"oupdated",text:(O.last_updated_label_ro||"Ultima actualizare")+" / "+(O.last_updated_label_en||"Last updated")+": "+fmtDT(O.last_updated)+" (BST/UK)"}));

  // Money
  var money = S.money || {};

/* ---------- loading: try every URL, newest generated_at wins; bundled copy is the last resort ---------- */
function valid(j){ return j && typeof j==="object" && j.metrics && j.generated_at && j.layout && j.hierarchy && j.challenge; }
function load(){
  var urls = (CFG.SNAPSHOT_URLS||[]).slice(); var cands = []; TRIED = [];
  return Promise.all(urls.map(function(u){
    if(location.protocol==="file:" && !/^https?:/.test(u)){ TRIED.push({url:u,ok:false,err:"not fetchable from file:// (bundled copy used instead)"}); return Promise.resolve(); }
    var sep = u.indexOf("?")>=0?"&":"?";
    return fetch(u+sep+"_="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })

    if(!cands.length) throw new Error("All sources failed: "+TRIED.map(function(x){return x.url+" ("+x.err+")";}).join("; "));
